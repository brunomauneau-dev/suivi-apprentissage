<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des référencements</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js" defer></script>
<script src="lib/xlsx.full.min.js" defer></script>
<script src="suivi.js?v=10" defer></script>
<style>
  :root {
    --bg: #f6f6f6; --card: #ffffff; --text: #1e1e1e; --muted: #666; --line: #e5e5e5;
    --blue: #000091; --green: #18753c; --green-bg: #e3f4e8; --amber: #b34000; --amber-bg: #fff1e0;
    --red: #ce0500; --red-bg: #fde8e7; --grey: #c9c9c9; --grey-bg: #f0f0f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Marianne, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi { background: var(--grey-bg); border-radius: 8px; padding: 8px 14px; text-align: center; min-width: 92px; }
  .kpi b { display: block; font-size: 20px; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .kpi.ok b { color: var(--green); } .kpi.warn b { color: var(--amber); } .kpi.ko b { color: var(--red); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 24px 0; }
  .bar input { flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: var(--card); }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font: inherit; color: var(--text); }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  main { padding: 14px 24px 40px; display: flex; flex-direction: column; gap: 10px; }
  .etab { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .etab-head { display: grid; grid-template-columns: 22px 1fr 220px 260px; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; }
  .etab-head:hover { background: #fafafa; }
  .chev { transition: transform .15s; color: var(--muted); }
  .etab.open .chev { transform: rotate(90deg); }
  .etab-name b { font-size: 15px; }
  .etab-name span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .progress { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--grey-bg); }
  .progress i { display: block; height: 100%; }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.warn { background: var(--amber-bg); color: var(--amber); }
  .tag.ko { background: var(--red-bg); color: var(--red); }
  .tag.wait { background: var(--grey-bg); color: var(--muted); }
  .forms { display: none; border-top: 1px solid var(--line); }
  .etab.open .forms { display: block; }
  .form { display: grid; grid-template-columns: 220px 1fr 290px; gap: 16px; align-items: center; padding: 14px 18px 14px 54px; border-bottom: 1px solid var(--line); }
  .form:last-child { border-bottom: 0; }
  .form-name b { display: block; }
  .form-name span { color: var(--muted); font-size: 12px; }
  .steps { display: flex; align-items: flex-start; }
  .step { flex: 1; position: relative; text-align: center; font-size: 11px; color: var(--muted); }
  .step::before { content: ""; position: absolute; top: 9px; left: -50%; width: 100%; height: 2px; background: var(--grey); z-index: 0; }
  .step:first-child::before { display: none; }
  .step.done::before, .step.warn::before, .step.ko::before { background: var(--green); }
  .dot { position: relative; z-index: 1; width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 4px; background: var(--card); border: 2px solid var(--grey); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
  .step.done .dot { background: var(--green); border-color: var(--green); }
  .step.warn .dot { background: #f5a000; border-color: #f5a000; }
  .step.ko .dot { background: var(--red); border-color: var(--red); }
  .step.done, .step.warn, .step.ko { color: var(--text); }
  .step em { display: block; font-style: normal; color: var(--muted); font-size: 11px; }
  .next { font-size: 13px; }
  .next b { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-bottom: 2px; }
  .next.ko { color: var(--red); } .next.warn { color: var(--amber); } .next.ok { color: var(--green); }
  .banner { margin: 14px 24px 0; padding: 10px 14px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); font-size: 13px; }
  .refresh { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 7px 10px; cursor: pointer; font: inherit; }
  .form.refusee { opacity: .45; }
  .demo { margin: 14px 24px 0; padding: 8px 12px; border-radius: 8px; background: #e8edff; color: var(--blue); font-size: 12px; }
  .step { background: none; border: 0; font: inherit; font-size: 11px; line-height: 1.3; cursor: pointer; padding: 2px 0; border-radius: 6px; }
  .step:hover { background: #f0f3ff; }
  .btn-nouveau { background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; font: inherit; font-weight: 600; }
  .btn-lien { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font: inherit; font-size: 12px; text-decoration: underline; }
  .btn-lien.rouge { color: var(--red); }
  .outils { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
  .btn-lien { white-space: nowrap; }
  .com { margin-top: 4px; font-size: 12px; color: var(--muted); font-style: italic; }
  .ajout-ligne { padding: 10px 18px 12px 54px; }
  .pop { position: absolute; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
  .pop-large { width: 380px; }
  .pop label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .pop label small { color: var(--muted); font-weight: 400; }
  .pop input, .pop textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; }
  .pop-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; }
  .btn.vert { background: var(--green); } .btn.rouge { background: var(--red); } .btn.gris { background: var(--grey-bg); color: var(--text); }
  .panneaux { padding: 14px 24px 0; display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .panneau { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
  .panneau h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .compte { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .compte.ko { background: var(--red-bg); color: var(--red); } .compte.warn { background: var(--amber-bg); color: var(--amber); } .compte.ok { background: var(--green-bg); color: var(--green); }
  .cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .carte { border: 1px solid var(--red-bg); border-left: 4px solid var(--red); border-radius: 8px; padding: 10px 12px; }
  .carte-tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .carte ul, .taches { margin: 0; padding-left: 18px; font-size: 13px; }
  .carte li, .taches li { margin: 3px 0; }
  .taches { list-style: none; padding: 0; max-height: 260px; overflow: auto; }
  .btn.petit { padding: 5px 9px; font-size: 12px; }
  .rien { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .titre-liste { padding: 18px 24px 0; font-size: 16px; margin: 0; }
  @media (max-width: 900px) { .panneaux { grid-template-columns: 1fr; } }
  .pop-fiche { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 60px); overflow: auto; }
  .fiche-tete { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; }
  .pop h3 { font-size: 13px; margin: 8px 0 4px; color: var(--blue); }
  .fiche-grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .champ { display: flex; flex-direction: column; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .champ span { color: var(--muted); } .champ b { font-weight: 600; min-height: 1em; }
  .controles { list-style: none; padding: 0; margin: 0; columns: 2; font-size: 13px; }
  .comp { border-collapse: collapse; font-size: 13px; width: 100%; }
  .comp th, .comp td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  .pop .ok { color: var(--green); font-weight: 700; } .pop .ko { color: var(--red); font-weight: 700; }
  #pop-lien { width: 100%; }
  .step.auto { cursor: help; }
  @media (max-width: 900px) { .fiche-grille { grid-template-columns: 1fr; } }
  .case { display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0; }
  .etab-name .btn-lien { font-size: 11px; margin-left: 6px; opacity: .7; }
  .contact { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .contact a { color: var(--blue); }
  .contact-saisie { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .contact-saisie legend { font-size: 12px; color: var(--muted); }
  .gestion { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .gestion .btn-lien { font-size: 11px; opacity: .75; }
  .outils { align-items: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  @media (max-width: 900px) {
    .etab-head { grid-template-columns: 22px 1fr; }
    .etab-head > :nth-child(3), .etab-head > :nth-child(4) { grid-column: 2; }
    .tags { justify-content: flex-start; }
    .form { grid-template-columns: 1fr; padding-left: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>Suivi des référencements en apprentissage<small id="sous-titre">Chargement…</small></h1>
  <div class="kpis" id="kpis"></div>
</header>
<div id="bandeaux"></div>
<div class="panneaux" id="panneaux"></div>
<h2 class="titre-liste">Toutes les formations, par établissement</h2>
<div class="bar">
  <input id="q" type="search" placeholder="Rechercher un établissement ou une formation…">
  <button class="chip on" data-f="tous">Tous</button>
  <button class="chip" data-f="relance">À relancer</button>
  <button class="chip" data-f="saio">À faire SAIO</button>
  <button class="chip" data-f="attente">En attente</button>
  <button class="chip" data-f="publie">Publiées cette campagne</button>
  <button class="chip" data-f="parcoursup">Déjà sur Parcoursup</button>
  <button class="btn-nouveau" id="nouveau">+ Nouvelle demande</button>
  <button class="refresh" id="importer" title="Fichier .xlsb, .xlsx ou .csv reçu de CAP Métiers">Importer l'export Carif-Oref</button>
  <input type="file" id="fichier-export" accept=".xlsb,.xlsx,.xls,.csv" hidden>
</div>
<main id="liste"></main>
</body>
</html>
